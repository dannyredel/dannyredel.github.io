project:
  type: website
  render:
    - "*.qmd"
    - "*.ipynb"
    - "!knowledge/"
  # Chatbot widget disabled until backend is deployed — re-enable with include-after-body below.
  # resources:
  #   - "chatbot/widget.html"

website:
  title: "Daniel Redel"
  favicon: myprofile.jpg
  search:
    location: navbar
    type: overlay
  navbar:
    background: dark
    right:
      - href: myposts.qmd
        text: Blog
        icon: pencil-square
      - href: projects.qmd
        text: Projects
        icon: folder
      - href: research.qmd
        text: Research
        icon: journal-text
      - href: about.qmd
        text: About
        icon: person
      - icon: github
        href: https://github.com/dannyredel
      - icon: linkedin
        href: https://www.linkedin.com/in/daniel-redel-14b052b6/  
      - icon: twitter
        href: https://twitter.com/DannyRedel
  back-to-top-navigation: true
  page-footer: 
    center: "© 2026 Daniel Redel"

format:
  html:
    theme: [flatly, styles.scss]
    code-link: true
    smooth-scroll: true
    # Chatbot widget disabled until the backend is deployed (defaults to localhost:8000).
    # Re-enable this and the `resources:` block above when the Railway backend is live.
    # include-after-body:
    #   - chatbot/widget.html